<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Grandfather: work to family</title>
  <desc id="description">Grandfather transitions from teacher and mentor to daily home life.</desc>
  <metadata>Original vector artwork authored for the Family ↔ Work Role Suite.</metadata>
  <defs>
<mask id="cardigan-cut" maskUnits="userSpaceOnUse"><rect width="512" height="512" fill="#fff" /><path d="M318 268 L344 292 L370 268 M344 292 L344 422 M303 348 L329 348 M359 348 L385 348" fill="none" stroke="#000" stroke-linecap="round" stroke-width="9" /></mask>
  
    <mask id="destination-reveal" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#000" />
      <circle class="reveal-disc" cx="130" cy="337" r="0" fill="#fff" />
    </mask>
    <style>
:root { --duration: 2.4s; --enter: cubic-bezier(.16, 1, .3, 1); --settle: cubic-bezier(.22, 1, .36, 1); }
      .source, .destination, .reveal-disc, .focus-ring { transform-box: fill-box; transform-origin: center; }
      .source { animation: source-out var(--duration) var(--enter) .12s forwards; }
      .destination { opacity: 0; mask: url(#destination-reveal); animation: destination-in var(--duration) var(--settle) .12s forwards; }
      .reveal-disc { animation: reveal var(--duration) var(--enter) .12s forwards; }
      .focus-ring { fill: none; stroke: currentColor; stroke-width: 5; opacity: 0; animation: ring var(--duration) var(--settle) .12s forwards; }
      @keyframes source-out {
        0%, 20% { opacity: 1; transform: none; }
        38% { opacity: 1; transform: translateY(3px) scale(.975); }
        68% { opacity: .28; transform: translateY(-2px) scale(1.012); }
        100% { opacity: 0; transform: translateY(4px) scale(.96); }
      }
      @keyframes destination-in {
        0%, 16% { opacity: 0; transform: translateY(8px) scale(.92); }
        68% { opacity: 1; transform: translateY(-2px) scale(1.012); }
        86% { opacity: 1; transform: translateY(1px) scale(.997); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes reveal { 0%, 16% { r: 0; } 100% { r: 650px; } }
      @keyframes ring { 0%, 16% { opacity: 0; r: 0; } 44% { opacity: .22; } 100% { opacity: 0; r: 650px; stroke-width: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .source { animation: none; opacity: 0; }
        .destination { animation: none; opacity: 1; transform: none; }
        .reveal-disc { animation: none; r: 650px; }
        .focus-ring { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <g class="source" data-state="work">
<g id="work-art" fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
<path id="grandfather-head" d="M327 87 C346 76 373 77 393 90 C413 104 423 128 419 153 L414 181 C407 204 390 222 367 229 L339 225 C315 217 299 197 295 172 L297 137 C300 116 310 99 327 87 Z M312 139 L311 166 C314 188 329 207 348 213 C368 215 388 200 397 178 L400 147 L381 137 L352 133 L333 124 Z" />
    
<g id="glasses" fill="none" stroke="currentColor" stroke-width="8"><circle cx="334" cy="160" r="20" /><circle cx="382" cy="160" r="20" /><path d="M354 160 L362 160" /></g>
    
<path id="grandfather-body" mask="url(#cardigan-cut)" d="M329 227 L369 227 L377 247 L408 257 L431 275 L450 307 L475 392 L472 412 L459 424 L374 432 L333 430 L315 416 L281 417 L277 390 L263 380 L239 401 L210 401 L201 379 L238 306 L257 276 L281 259 L322 248 Z M404 337 L399 393 L437 388 Z" />
    
<g id="teacher-cues" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path id="lectern" stroke="none" d="M40 324 L216 324 L201 371 L151 371 L167 449 L88 449 L104 371 L55 371 Z M63 339 L193 339 L187 356 L69 356 Z" />
  <path id="lesson-book" stroke="none" d="M52 282 C83 272 111 279 130 294 L130 326 C108 312 83 307 52 315 Z M136 294 C158 277 183 272 212 282 L212 315 C184 307 159 312 136 326 Z" />
  <path id="pointer" d="M219 262 L172 332" fill="none" stroke-width="9" />
</g>
</g>
  </g>
  <g class="destination" data-state="family">
<g fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
    <path id="grandfather-head" d="M327 87 C346 76 373 77 393 90 C413 104 423 128 419 153 L414 181 C407 204 390 222 367 229 L339 225 C315 217 299 197 295 172 L297 137 C300 116 310 99 327 87 Z M312 139 L311 166 C314 188 329 207 348 213 C368 215 388 200 397 178 L400 147 L381 137 L352 133 L333 124 Z" />
    <g id="glasses" fill="none" stroke="currentColor" stroke-width="8"><circle cx="334" cy="160" r="20" /><circle cx="382" cy="160" r="20" /><path d="M354 160 L362 160" /></g>
    <path id="grandfather-body" mask="url(#cardigan-cut)" d="M329 227 L369 227 L377 247 L408 257 L431 275 L450 307 L475 392 L472 412 L459 424 L374 432 L333 430 L315 416 L281 417 L277 390 L263 380 L239 401 L210 401 L201 379 L238 306 L257 276 L281 259 L322 248 Z M404 337 L399 393 L437 388 Z" />
    <path id="cane" d="M85 457 L70 457 L70 293 C70 263 89 244 116 244 C139 244 156 260 156 281 C156 300 142 315 123 316 L123 300 C133 299 140 291 140 281 C140 269 130 260 116 260 C97 260 85 273 85 293 Z" />
  </g>

  </g>
  <circle class="focus-ring" cx="130" cy="337" r="0" />
</svg>
