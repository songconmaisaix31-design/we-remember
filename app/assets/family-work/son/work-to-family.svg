<g fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
    <path id="son-head" d="M305 104 C319 83 343 74 370 78 C394 81 412 95 421 115 L439 122 L432 139 L411 140 L412 168 C411 195 393 218 367 227 L339 225 C316 216 301 196 297 170 L298 139 L284 137 L286 120 Z M315 141 L314 168 C318 190 332 207 351 212 C370 215 388 201 397 181 L400 151 L379 140 L348 136 Z" />
    <path id="headphones" d="M299 142 C299 103 323 82 356 82 C390 82 413 105 413 143 L401 143 C400 114 383 96 356 96 C329 96 312 113 311 143 Z M292 145 L310 145 L310 185 L294 185 Z M402 145 L420 145 L418 185 L402 185 Z" />
