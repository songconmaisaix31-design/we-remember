    <path id="wrench" d="M76 300 L67 288 L137 222 L132 201 L146 188 L161 203 L157 218 L173 215 L185 227 L180 244 L163 252 L149 246 L88 308 Z M69 293 L78 302 L68 312 L58 302 Z" />
  </g>

  </g>
  <g class="destination" data-state="work">
<g id="work-art" fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
<path id="father-head" d="M326 82 L370 82 L393 94 L405 112 L410 139 L407 174 L397 201 L379 220 L355 228 L331 222 L312 205 L301 181 L299 145 L307 113 Z M317 139 L315 164 L321 186 L334 204 L352 212 L370 205 L384 188 L390 166 L387 139 L371 126 L346 124 Z" />
    
